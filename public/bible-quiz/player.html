<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📜 聖經成書小測驗</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #1a1a2e; --card: #16213e; --accent: #e94560; --gold: #f5a623;
  --white: #fff; --muted: #aaa;
}
body {
  font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
  background: var(--bg); color: var(--white);
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 16px;
}
.screen { display: none; width: 100%; max-width: 560px; flex-direction: column; align-items: center; gap: 20px; animation: fadeIn .4s ease; }
.screen.active { display: flex; }
@keyframes fadeIn { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

h1 { font-size: clamp(24px,6vw,40px); font-weight: 900; text-align: center; }
.sub { font-size: 15px; color: var(--muted); text-align: center; }
.card { width:100%; background:var(--card); border-radius:20px; padding:28px 24px; }

input[type=text] {
  width:100%; padding:16px 20px; border-radius:14px; border:2px solid #333;
  background:#0d1117; color:#fff; font-size:18px; font-family:inherit;
  outline:none; transition:border .2s;
}
input[type=text]:focus { border-color: var(--gold); }

.btn {
  width:100%; border:none; cursor:pointer; border-radius:14px;
  font-weight:800; font-family:inherit; font-size:18px;
  padding:18px; transition:filter .15s, transform .1s;
}
.btn:active { transform:scale(.97); }
.btn-primary { background:var(--accent); color:#fff; box-shadow:0 6px 20px rgba(233,69,96,.4); }
.btn-primary:hover { filter:brightness(1.1); }
.btn-next { background: var(--gold); color:#111; box-shadow:0 6px 20px rgba(245,166,35,.4); }
.btn-next:hover { filter:brightness(1.05); }

.room-code { font-size: clamp(36px,10vw,56px); font-weight:900; color:var(--gold); letter-spacing:8px; text-align:center; }
.player-count { font-size:64px; font-weight:900; color:var(--gold); text-align:center; }
.waiting-pulse { animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

/* top bar */
.top-bar {
  width:100%; display:flex; align-items:center; justify-content:space-between;
  background:var(--card); border-radius:14px; padding:12px 18px;
}
.q-num { font-size:17px; font-weight:800; }
.score-chip { background:var(--gold); color:#111; border-radius:99px; padding:6px 18px; font-weight:900; font-size:15px; }

.prog { width:100%; height:5px; background:rgba(255,255,255,.1); border-radius:99px; overflow:hidden; }
.prog-fill { height:100%; background:var(--accent); border-radius:99px; transition:width .4s ease; }

.q-card {
  width:100%; background:var(--card); border-radius:18px; padding:26px 20px;
  font-size:clamp(17px,4vw,22px); font-weight:700; line-height:1.5; text-align:center;
  min-height:90px; display:flex; align-items:center; justify-content:center;
}

.opts { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.opt {
  border:none; cursor:pointer; border-radius:14px; padding:20px 14px;
  font-size:clamp(14px,3vw,17px); font-weight:700; font-family:inherit; color:#fff;
  display:flex; align-items:center; gap:10px; text-align:left; line-height:1.4;
  box-shadow:0 4px 12px rgba(0,0,0,.3); transition:transform .12s, filter .12s;
}
.opt:hover:not(:disabled) { transform:translateY(-3px); filter:brightness(1.1); }
.opt:disabled { cursor:default; }
.opt-A { background: linear-gradient(135deg,#e74c3c,#c0392b); }
.opt-B { background: linear-gradient(135deg,#2980b9,#1a5f8a); }
.opt-C { background: linear-gradient(135deg,#f39c12,#d68910); }
.opt-D { background: linear-gradient(135deg,#27ae60,#1e8449); }
.opt-lbl { background:rgba(255,255,255,.25); border-radius:50%; width:32px; height:32px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:900; }
.opt.correct { outline:3px solid #2ecc71; animation:pcorrect .5s; }
.opt.wrong   { outline:3px solid #e74c3c; opacity:.5; }
.opt.dim     { opacity:.3; }
@keyframes pcorrect { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }

/* inline reveal after answer */
.inline-reveal {
  width:100%; background:var(--card); border-radius:16px; padding:20px;
  display:flex; flex-direction:column; gap:12px; align-items:center;
}
.inline-result { font-size:22px; font-weight:900; text-align:center; }
.inline-result.ok   { color:#2ecc71; }
.inline-result.fail { color:#e74c3c; }
.pts-pop { font-size:32px; font-weight:900; color:var(--gold); animation:pop .5s cubic-bezier(.175,.885,.32,1.275); }
@keyframes pop { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
.fact { width:100%; background:rgba(245,166,35,.1); border:1px solid rgba(245,166,35,.4); border-radius:12px; padding:14px 16px; font-size:14px; line-height:1.7; color:#ffe08a; }
.fact strong { font-size:11px; text-transform:uppercase; letter-spacing:1px; opacity:.7; display:block; margin-bottom:4px; }

/* waiting for game to start */
.spinner { display:inline-block; width:28px; height:28px; border:3px solid rgba(255,255,255,.1); border-top-color:var(--gold); border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }

/* leaderboard / end */
.rank-list { width:100%; display:flex; flex-direction:column; gap:10px; }
.rank-row { display:flex; align-items:center; gap:14px; background:var(--card); border-radius:14px; padding:14px 16px; }
.rank-no { font-size:22px; font-weight:900; width:36px; text-align:center; }
.rank-name { flex:1; font-size:16px; font-weight:700; }
.rank-score { font-size:18px; font-weight:900; color:var(--gold); }
.rank-row.me { border:2px solid var(--accent); }
.rank-row:nth-child(1) .rank-no { color:#ffd700; font-size:28px; }
.rank-row:nth-child(2) .rank-no { color:#c0c0c0; }
.rank-row:nth-child(3) .rank-no { color:#cd7f32; }

.confetti-wrap { position:fixed; inset:0; pointer-events:none; z-index:9999; }

/* waiting for others banner */
.others-banner {
  width:100%; text-align:center; padding:10px;
  font-size:13px; color:var(--muted);
}

@media(max-width:420px) { .opts { grid-template-columns:1fr; } }
</style>
</head>
<body>

<!-- ① 輸入房號 -->
<div id="s-room" class="screen active">
  <div style="font-size:72px;text-align:center">📜</div>
  <h1>聖經成書小測驗</h1>
  <div class="sub">輸入主持人提供的房號</div>
  <div class="card" style="gap:14px;display:flex;flex-direction:column">
    <input id="inp-room" type="text" placeholder="房號（例：ABC123）" maxlength="6"
      style="text-transform:uppercase;letter-spacing:4px;font-size:24px;text-align:center">
    <button class="btn btn-primary" onclick="joinRoom()">進入房間 →</button>
  </div>
</div>

<!-- ② 輸入暱稱 -->
<div id="s-name" class="screen">
  <div style="font-size:56px;text-align:center">✋</div>
  <h1>你的暱稱</h1>
  <div class="sub">放心，只有第一名才會被公布名字 😄</div>
  <div class="card" style="gap:14px;display:flex;flex-direction:column">
    <input id="inp-name" type="text" placeholder="輸入你的暱稱" maxlength="12">
    <button class="btn btn-primary" onclick="joinGame()">加入遊戲 🚀</button>
  </div>
</div>

<!-- ③ 等待開始 -->
<div id="s-lobby" class="screen">
  <div class="room-code" id="room-display">------</div>
  <div class="sub">等待主持人開始…</div>
  <div class="card" style="text-align:center;gap:10px;display:flex;flex-direction:column">
    <div class="player-count waiting-pulse" id="player-count">0</div>
    <div class="sub">位玩家已加入</div>
  </div>
</div>

<!-- ④ 答題（含答後 inline reveal） -->
<div id="s-quiz" class="screen">
  <div class="top-bar">
    <div class="q-num" id="q-num">1 / 6</div>
    <div class="score-chip">⭐ <span id="score-disp">0</span></div>
  </div>
  <div class="prog"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="q-card" id="q-text">問題載入中…</div>
  <div class="opts" id="opts-grid"></div>

  <!-- 答完後顯示，答前隱藏 -->
  <div id="inline-reveal" style="display:none; width:100%; display:none; flex-direction:column; gap:14px; align-items:center;">
    <div class="inline-reveal">
      <div style="font-size:48px" id="rv-emoji">🎉</div>
      <div class="inline-result" id="rv-result">答對了！</div>
      <div class="pts-pop" id="rv-pts">+1000</div>
      <div class="fact" id="rv-fact">
        <strong>📖 你知道嗎？</strong>
        <span id="rv-fact-txt"></span>
      </div>
    </div>
    <button class="btn btn-next" id="btn-next" onclick="goNextQuestion()">下一題 →</button>
    <div class="others-banner" id="others-banner"></div>
  </div>
</div>

<!-- ⑤ 等待主持人講解（全部答完後） -->
<div id="s-waiting-end" class="screen">
  <div style="font-size:64px;text-align:center">🎊</div>
  <h1>你已完成所有題目！</h1>
  <div class="card" style="text-align:center;gap:8px;display:flex;flex-direction:column">
    <div style="font-size:56px;font-weight:900;color:var(--gold)" id="my-score-final">0</div>
    <div class="sub" id="my-detail">答對 0 / 6 題</div>
  </div>
  <div style="text-align:center;color:var(--muted);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:10px">
    <div class="spinner"></div>
    等待主持人公布最終排名…
  </div>
</div>

<!-- ⑥ 最終排行榜（主持人觸發） -->
<div id="s-end" class="screen">
  <div style="font-size:72px;text-align:center" id="end-emoji">🎊</div>
  <h1 id="end-title">測驗完成！</h1>
  <div class="card" style="text-align:center;gap:8px;display:flex;flex-direction:column">
    <div style="font-size:56px;font-weight:900;color:var(--gold)" id="end-score">0</div>
    <div class="sub" id="end-detail">答對 0 / 6 題</div>
  </div>
  <div class="rank-list" id="end-rank-list"></div>
</div>

<div class="confetti-wrap" id="confetti-wrap"></div>

<script>
const SUPABASE_URL      = 'https://yucarcuvfonsqxmdqfmy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1Y2FyY3V2Zm9uc3F4bWRxZm15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NjMzMTgsImV4cCI6MjA4OTMzOTMxOH0.2kzZnoDrn_1WuSXol8OBouQ4YmRzi13vCWws_0c5Eso';

const QUESTIONS = [
  { q:"🎯 聖經是一本書還是一本書庫？", opts:["一本書","一本書庫（多卷合集）","小說集","歷史年表"], correct:1, fact:"聖經是由 66 卷書組成的書庫，約 40 位作者，歷時約 1,500 年完成，原文使用希伯來文、亞蘭文和希臘文。" },
  { q:"🎯 聖經共有幾卷？", opts:["39 卷","27 卷","66 卷","73 卷"], correct:2, fact:"舊約 39 卷，新約 27 卷，合計 66 卷。天主教聖經另包含次經，共 73 卷。" },
  { q:"🎯 聖經完成歷經多久？", opts:["約 100 年","約 500 年","約 1,000 年","約 1,500 年"], correct:3, fact:"聖經的寫作橫跨約 1,500 年，跨越了大約 40 個世代，卻有著一貫的主題——上帝的救恩。" },
  { q:"🎯 聖經約有多少位作者？", opts:["1 位","12 位","約 40 位","100 位"], correct:2, fact:"約 40 位作者背景各異，包括君王（大衛、所羅門）、先知、漁夫（彼得）、醫生（路加）等。" },
  { q:"🎯 以下哪種職業「不包含」在聖經作者中？", opts:["漁夫","醫生","君王","電腦工程師"], correct:3, fact:"神使用各種背景的人來寫下聖經——電腦工程師要等幾千年後才出現！" },
  { q:"🎯 聖經原文主要使用哪些語言？", opts:["中文、英文","希伯來文、亞蘭文、希臘文","拉丁文、希臘文","希伯來文、拉丁文"], correct:1, fact:"舊約主要以希伯來文寫成（另有少部分亞蘭文），新約幾乎全以當時的通用希臘文（Koine Greek）寫成。" }
];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let roomId = '', playerId = '';
let myScore = 0, myCorrect = 0;
let currentQIdx = 0;
let answered = false;

window.onload = () => {
  const params = new URLSearchParams(location.search);
  const room = params.get('room');
  if (room) document.getElementById('inp-room').value = room.toUpperCase();
};

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function joinRoom() {
  const code = document.getElementById('inp-room').value.trim().toUpperCase();
  if (code.length < 4) return alert('請輸入正確房號');
  const { data, error } = await sb.from('rooms').select('id,status').eq('id', code).single();
  if (error || !data) return alert('找不到房間，請確認房號');
  if (data.status === 'finished') return alert('這場遊戲已結束');
  roomId = code;
  show('s-name');
  document.getElementById('inp-name').focus();
}

async function joinGame() {
  const nick = document.getElementById('inp-name').value.trim();
  if (!nick) return alert('請輸入暱稱');
  const { data, error } = await sb.from('players').insert({ room_id: roomId, nickname: nick, score: 0, completed: false }).select().single();
  if (error) return alert('加入失敗：' + error.message);
  playerId = data.id;
  document.getElementById('room-display').textContent = roomId;
  show('s-lobby');
  subscribeRoom();
  fetchPlayerCount();
}

async function fetchPlayerCount() {
  const { count } = await sb.from('players').select('*', { count:'exact', head:true }).eq('room_id', roomId);
  document.getElementById('player-count').textContent = count ?? 0;
}

function subscribeRoom() {
  sb.channel('room:' + roomId)
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'rooms', filter:`id=eq.${roomId}` }, handleRoomUpdate)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'players', filter:`room_id=eq.${roomId}` }, () => fetchPlayerCount())
    .subscribe();
}

function handleRoomUpdate(payload) {
  const room = payload.new;
  if (room.status === 'question' && currentQIdx === 0 && !answered) {
    // 第一題由主持人觸發
    loadQuestion(0);
  }
  if (room.status === 'finished') showEnd();
}

function loadQuestion(qIdx) {
  currentQIdx = qIdx;
  answered = false;

  // 隱藏 inline reveal，顯示選項
  document.getElementById('inline-reveal').style.display = 'none';
  document.getElementById('opts-grid').style.display = 'grid';

  const q = QUESTIONS[qIdx];
  document.getElementById('q-num').textContent = `${qIdx + 1} / ${QUESTIONS.length}`;
  document.getElementById('prog-fill').style.width = `${(qIdx / QUESTIONS.length) * 100}%`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('score-disp').textContent = myScore;

  const grid = document.getElementById('opts-grid');
  grid.innerHTML = '';
  ['A','B','C','D'].forEach((lbl, i) => {
    const btn = document.createElement('button');
    btn.className = `opt opt-${lbl}`;
    btn.innerHTML = `<span class="opt-lbl">${lbl}</span><span>${q.opts[i]}</span>`;
    btn.onclick = () => selectAnswer(qIdx, i);
    grid.appendChild(btn);
  });

  show('s-quiz');
}

async function selectAnswer(qIdx, chosen) {
  if (answered) return;
  answered = true;

  const q = QUESTIONS[qIdx];
  const isCorrect = chosen === q.correct;
  const pts = isCorrect ? 1000 : 0;

  // 顯示選項結果
  const btns = document.querySelectorAll('.opt');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === chosen && !isCorrect) b.classList.add('wrong');
    else if (i !== q.correct) b.classList.add('dim');
  });

  if (isCorrect) { myScore += pts; myCorrect++; }

  await sb.from('answers').insert({ room_id:roomId, player_id:playerId, question_idx:qIdx, chosen, is_correct:isCorrect, pts });
  await sb.from('players').update({ score: myScore }).eq('id', playerId);

  if (isCorrect) launchConfetti();

  // 顯示 inline reveal
  showInlineReveal(isCorrect, pts, q.fact, qIdx);
}

function showInlineReveal(isCorrect, pts, fact, qIdx) {
  document.getElementById('rv-emoji').textContent = isCorrect ? '🎉' : '😅';
  const result = document.getElementById('rv-result');
  result.textContent = isCorrect ? '答對了！' : '沒關係，繼續學習！';
  result.className = 'inline-result ' + (isCorrect ? 'ok' : 'fail');

  const ptsPop = document.getElementById('rv-pts');
  ptsPop.textContent = isCorrect ? '+1000' : '';
  ptsPop.style.display = isCorrect ? 'block' : 'none';

  document.getElementById('rv-fact-txt').textContent = fact ?? '';

  // 最後一題改按鈕文字
  const btnNext = document.getElementById('btn-next');
  btnNext.textContent = qIdx < QUESTIONS.length - 1 ? '下一題 →' : '查看結果 🏆';

  document.getElementById('others-banner').textContent = '';
  document.getElementById('inline-reveal').style.display = 'flex';
}

async function goNextQuestion() {
  const nextIdx = currentQIdx + 1;
  if (nextIdx < QUESTIONS.length) {
    loadQuestion(nextIdx);
  } else {
    // 全部完成
    await sb.from('players').update({ completed: true }).eq('id', playerId);
    document.getElementById('my-score-final').textContent = myScore.toLocaleString();
    document.getElementById('my-detail').textContent = `答對 ${myCorrect} / ${QUESTIONS.length} 題`;
    show('s-waiting-end');
  }
}

async function showEnd() {
  const { data: players } = await sb.from('players').select('id,nickname,score').eq('room_id', roomId).order('score', { ascending:false }).limit(10);
  const rank = players.findIndex(p => p.id === playerId) + 1;

  let emoji = '🎊', title = '最終排名！';
  if (rank === 1) { emoji = '🏆'; title = '你是冠軍！！！'; launchConfetti(true); }

  document.getElementById('end-emoji').textContent = emoji;
  document.getElementById('end-title').textContent = title;
  document.getElementById('end-score').textContent = myScore.toLocaleString();
  document.getElementById('end-detail').textContent = `答對 ${myCorrect} / ${QUESTIONS.length} 題 · 第 ${rank} 名`;

  const list = document.getElementById('end-rank-list');
  list.innerHTML = '';
  const medals = ['🥇','🥈','🥉'];
  players.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'rank-row' + (p.id === playerId ? ' me' : '');
    const name = i === 0 ? p.nickname : (p.id === playerId ? p.nickname + ' (你)' : '匿名玩家');
    div.innerHTML = `<div class="rank-no">${medals[i]??i+1}</div><div class="rank-name">${name}</div><div class="rank-score">${p.score}</div>`;
    list.appendChild(div);
  });
  show('s-end');
}

function launchConfetti(big = false) {
  const wrap = document.getElementById('confetti-wrap');
  const colors = ['#f5a623','#e94560','#2ecc71','#3498db','#9b59b6','#fff'];
  for (let i = 0; i < (big ? 80 : 28); i++) {
    const el = document.createElement('div');
    const sz = Math.random() * 10 + 6;
    el.style.cssText = `position:absolute;left:${Math.random()*100}%;top:-20px;width:${sz}px;height:${sz}px;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>.5?'50%':'2px'};animation:fall ${1.5+Math.random()*2}s ease-in ${Math.random()*.5}s forwards;`;
    wrap.appendChild(el);
  }
  setTimeout(() => wrap.innerHTML = '', 4000);
}
const cs = document.createElement('style');
cs.textContent = `@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}`;
document.head.appendChild(cs);
</script>
</body>
</html>
